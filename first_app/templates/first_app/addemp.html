<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div>
    <form id="employeeForm">
        {% csrf_token %}

        <input type="text" name="id" id="id" placeholder="Enter ID">
        <br>

        <input type="text" name="name" id="name" placeholder="Enter name">
        <br>

        <input type="text" name="department" id="department" placeholder="Enter department">
        <br>

        <button type="submit">Add Employee</button>
    </form>
</div>
</body>
<script>document.getElementById("employeeForm").addEventListener("submit", async function(e) {
    e.preventDefault();

    const response = await fetch("{% url 'newemp' %}", {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
            "X-CSRFToken": document.querySelector('[name=csrfmiddlewaretoken]').value
        },
        body: JSON.stringify({
            id: document.getElementById("id").value,
            name: document.getElementById("name").value,
            department: document.getElementById("department").value
        })
    });

    const result = await response.json();

    alert(result.message || result.error);
});
</script>
</html>
